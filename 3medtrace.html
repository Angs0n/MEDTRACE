<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTrace - Verify Account</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* iPhone Frame */
    .phone-mockup {
      width: 375px;
      height: 760px;
      background-color: #ffffff;
      border: 4px solid #4a4d52;
      border-radius: 48px;
      position: relative;
      box-shadow: inset 0 0 0 2px #1f2124, 0 0 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Notch */
    .notch {
      width: 130px;
      height: 26px;
      background-color: #000000;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 10;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 12px 28px 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
      z-index: 5;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-signal { width: 14px; height: 10px; fill: #000000; }
    .icon-wifi { width: 13px; height: 10px; fill: #000000; }
    .icon-battery {
      width: 20px;
      height: 10px;
      border: 1px solid #000000;
      border-radius: 3px;
      padding: 1px;
      position: relative;
    }
    .icon-battery::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #000000;
      border-radius: 0 1px 1px 0;
    }
    .battery-level {
      width: 100%;
      height: 100%;
      background-color: #000000;
      border-radius: 1px;
    }

    /* Content Layout */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 28px 35px 28px;
      text-align: center;
    }

    .app-title {
      color: #0c2340;
      font-weight: 800;
      font-size: 1.45rem;
      letter-spacing: -0.2px;
      margin-bottom: 6px;
    }

    .sub-text {
      color: #475569;
      font-size: 0.72rem;
      font-weight: 500;
      margin-bottom: 32px;
    }

    /* 4-Digit Code Inputs */
    .otp-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 36px;
    }

    .otp-box {
      width: 44px;
      height: 44px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: #0c2340;
      outline: none;
      background-color: #ffffff;
      transition: border-color 0.2s ease;
    }

    .otp-box:focus {
      border-color: #1976d2;
    }

    /* Resend Code Section */
    .resend-text {
      font-size: 0.72rem;
      color: #475569;
      margin-bottom: 36px;
    }

    .resend-link {
      color: #0c2340;
      font-weight: 600;
      text-decoration: underline;
    }

    /* Verify Button */
    .action-area {
      width: 100%;
    }

    .btn-verify {
      display: block;
      width: 100%;
      background-color: #1976d2;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 13px 0;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    /* Home Bar */
    .home-indicator {
      width: 125px;
      height: 4px;
      background-color: #000000;
      border-radius: 2px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    <!-- Top Notch -->
    <div class="notch"></div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <svg class="icon-signal" viewBox="0 0 16 12">
          <rect x="0" y="9" width="3" height="3" rx="0.5"/>
          <rect x="4" y="6" width="3" height="6" rx="0.5"/>
          <rect x="8" y="3" width="3" height="9" rx="0.5"/>
          <rect x="12" y="0" width="3" height="12" rx="0.5"/>
        </svg>
        <svg class="icon-wifi" viewBox="0 0 16 12">
          <path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4.24-2.83a6 6 0 0 1 8.48 0l-1.41 1.41a4 4 0 0 0-5.66 0L3.76 6.67zm-2.83-2.83a10 10 0 0 1 14.14 0l-1.41 1.41a8 8 0 0 0-11.32 0L.93 3.84z"/>
        </svg>
        <div class="icon-battery">
          <div class="battery-level"></div>
        </div>
      </div>
    </div>

    <!-- Screen Content -->
    <div class="app-content">
      <h1 class="app-title">Verify Your Account</h1>
      <p class="sub-text">We've sent a verification code to your phone</p>

      <form onsubmit="event.preventDefault();" class="action-area">
        <!-- 4 Digit Input Fields -->
        <div class="otp-container">
          <input type="text" maxlength="1" class="otp-box" autofocus />
          <input type="text" maxlength="1" class="otp-box" />
          <input type="text" maxlength="1" class="otp-box" />
          <input type="text" maxlength="1" class="otp-box" />
        </div>

        <p class="resend-text">
          Didn't receive a code?<br>
          <a href="#resend" class="resend-link">Resend code</a>
        </p>

        <button type="submit" class="btn-verify">Verify</button>
      </form>
    </div>

    <!-- Home Indicator Notch -->
    <div class="home-indicator"></div>
  </div>

  <!-- Optional JS to automatically jump to next box when typing numbers -->
  <script>
    const inputs = document.querySelectorAll('.otp-box');
    inputs.forEach((input, index) => {
      input.addEventListener('keyup', (e) => {
        if (e.key >= 0 && e.key <= 9) {
          if (index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        } else if (e.key === 'Backspace') {
          if (index > 0) {
            inputs[index - 1].focus();
          }
        }
      });
    });
  </script>

  <script src="medtrace-navigation.js"></script>
</body>
</html>

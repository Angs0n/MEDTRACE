<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTrace - Request Medical Information</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* iPhone Frame */
    .phone-mockup {
      width: 375px;
      height: 760px;
      background-color: #ffffff;
      border: 4px solid #4a4d52;
      border-radius: 48px;
      position: relative;
      box-shadow: inset 0 0 0 2px #1f2124, 0 0 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Notch */
    .notch {
      width: 130px;
      height: 26px;
      background-color: #000000;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 10;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 12px 28px 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
      z-index: 5;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-signal { width: 14px; height: 10px; fill: #000000; }
    .icon-wifi { width: 13px; height: 10px; fill: #000000; }
    .icon-battery {
      width: 20px;
      height: 10px;
      border: 1px solid #000000;
      border-radius: 3px;
      padding: 1px;
      position: relative;
    }
    .icon-battery::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #000000;
      border-radius: 0 1px 1px 0;
    }
    .battery-level {
      width: 100%;
      height: 100%;
      background-color: #000000;
      border-radius: 1px;
    }

    /* Content Area */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 24px 0 24px;
    }

    /* Header Title & Subtitle */
    .page-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #0c2340;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.25;
      max-width: 220px;
    }

    .page-subtitle {
      font-size: 0.65rem;
      color: #64748b;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 24px;
      max-width: 200px;
    }

    /* Checkbox Group Box */
    .checkbox-card {
      width: 100%;
      max-width: 260px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px 18px;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid #64748b;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    .checkbox-item label {
      font-size: 0.68rem;
      font-weight: 500;
      color: #1e293b;
      cursor: pointer;
    }

    /* Reason Dropdown Section */
    .dropdown-group {
      width: 100%;
      max-width: 260px;
      margin-bottom: 32px;
    }

    .dropdown-label {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      color: #0c2340;
      margin-bottom: 8px;
    }

    .dropdown-select-wrapper {
      position: relative;
      width: 100%;
    }

    .dropdown-select {
      width: 100%;
      height: 38px;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0 32px 0 12px;
      font-size: 0.7rem;
      color: #64748b;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      outline: none;
    }

    .dropdown-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 6px;
      pointer-events: none;
      fill: none;
      stroke: #64748b;
      stroke-width: 1.5;
    }

    /* Action Button */
    .btn-send {
      width: 100%;
      max-width: 260px;
      height: 40px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      height: 56px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      background-color: #ffffff;
      padding-bottom: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke: #0c2340;
      fill: none;
      stroke-width: 2;
    }

    .nav-item.active svg {
      stroke: #0c2340;
      fill: #0c2340;
    }

    /* Home Indicator Notch */
    .home-indicator {
      width: 125px;
      height: 4px;
      background-color: #000000;
      border-radius: 2px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    <div class="notch"></div>

    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <svg class="icon-signal" viewBox="0 0 16 12">
          <rect x="0" y="9" width="3" height="3" rx="0.5"/>
          <rect x="4" y="6" width="3" height="6" rx="0.5"/>
          <rect x="8" y="3" width="3" height="9" rx="0.5"/>
          <rect x="12" y="0" width="3" height="12" rx="0.5"/>
        </svg>
        <svg class="icon-wifi" viewBox="0 0 16 12">
          <path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4.24-2.83a6 6 0 0 1 8.48 0l-1.41 1.41a4 4 0 0 0-5.66 0L3.76 6.67zm-2.83-2.83a10 10 0 0 1 14.14 0l-1.41 1.41a8 8 0 0 0-11.32 0L.93 3.84z"/>
        </svg>
        <div class="icon-battery">
          <div class="battery-level"></div>
        </div>
      </div>
    </div>

    <div class="app-content">
      <h1 class="page-title">Request medical information</h1>
      <p class="page-subtitle">Select the information you need for this consultation</p>

      <div class="checkbox-card">
        <div class="checkbox-item">
          <input type="checkbox" id="cond">
          <label for="cond">Medical conditions</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="allg">
          <label for="allg">Allergies</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="meds">
          <label for="meds">Current medications</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="proc">
          <label for="proc">Previous procedures</label>
        </div>
      </div>

      <div class="dropdown-group">
        <label class="dropdown-label">Reason for access</label>
        <div class="dropdown-select-wrapper">
          <select class="dropdown-select">
            <option>Consultation</option>
            <option>Emergency</option>
            <option>Routine Checkup</option>
          </select>
          <svg class="dropdown-arrow" viewBox="0 0 10 6">
            <path d="M1 1l4 4 4-4" />
          </svg>
        </div>
      </div>

      <button class="btn-send">Send Request</button>
    </div>

    <div class="bottom-nav">
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>

</body>
  <script src="medtrace-navigation.js"></script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTrace - Medical Access Request</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* iPhone Frame */
    .phone-mockup {
      width: 375px;
      height: 760px;
      background-color: #ffffff;
      border: 4px solid #4a4d52;
      border-radius: 48px;
      position: relative;
      box-shadow: inset 0 0 0 2px #1f2124, 0 0 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Notch */
    .notch {
      width: 130px;
      height: 26px;
      background-color: #000000;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 10;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 12px 28px 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
      z-index: 5;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-signal { width: 14px; height: 10px; fill: #000000; }
    .icon-wifi { width: 13px; height: 10px; fill: #000000; }
    .icon-battery {
      width: 20px;
      height: 10px;
      border: 1px solid #000000;
      border-radius: 3px;
      padding: 1px;
      position: relative;
    }
    .icon-battery::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #000000;
      border-radius: 0 1px 1px 0;
    }
    .battery-level {
      width: 100%;
      height: 100%;
      background-color: #000000;
      border-radius: 1px;
    }

    /* Content Area */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 0 20px;
      overflow-y: auto;
    }

    .app-content::-webkit-scrollbar {
      display: none;
    }

    /* Title */
    .page-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0c2340;
      margin-bottom: 16px;
    }

    /* Hospital Info Banner */
    .hospital-card {
      background-color: #0d2847;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
    }

    .info-row svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .info-row span {
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* Request Subtext */
    .request-text {
      font-size: 0.72rem;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    /* Section Label */
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #000000;
      margin-bottom: 12px;
    }

    /* Requested Items List */
    .requested-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 36px;
    }

    .requested-item {
      background-color: #0d2847;
      border-radius: 10px;
      height: 44px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .requested-item svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .requested-item span {
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 700;
    }

    /* Action Buttons Row */
    .action-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .btn-reject {
      width: 90px;
      height: 42px;
      background-color: #ffffff;
      border: 1px solid #000000;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #000000;
      cursor: pointer;
    }

    .btn-approve {
      width: 90px;
      height: 42px;
      background-color: #0d2847;
      border: none;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      cursor: pointer;
    }

    /* Home Indicator Notch */
    .home-indicator {
      width: 125px;
      height: 4px;
      background-color: #000000;
      border-radius: 2px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    <div class="notch"></div>

    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <svg class="icon-signal" viewBox="0 0 16 12">
          <rect x="0" y="9" width="3" height="3" rx="0.5"/>
          <rect x="4" y="6" width="3" height="6" rx="0.5"/>
          <rect x="8" y="3" width="3" height="9" rx="0.5"/>
          <rect x="12" y="0" width="3" height="12" rx="0.5"/>
        </svg>
        <svg class="icon-wifi" viewBox="0 0 16 12">
          <path d="M8 9.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4.24-2.83a6 6 0 0 1 8.48 0l-1.41 1.41a4 4 0 0 0-5.66 0L3.76 6.67zm-2.83-2.83a10 10 0 0 1 14.14 0l-1.41 1.41a8 8 0 0 0-11.32 0L.93 3.84z"/>
        </svg>
        <div class="icon-battery">
          <div class="battery-level"></div>
        </div>
      </div>
    </div>

    <div class="app-content">
      
      <h1 class="page-title">Medical Access Request</h1>

      <div class="hospital-card">
        <div class="info-row">
          <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 9h6M9 13h6M12 7v10"/></svg>
          <span>XYZ Hospital</span>
        </div>
        <div class="info-row">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Dr. Ahmed</span>
        </div>
      </div>

      <p class="request-text">Dr. Ahmed is requesting access to your medical information.</p>

      <p class="section-label">Requested information</p>

      <div class="requested-list">
        <div class="requested-item">
          <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Medical Conditions</span>
        </div>
        <div class="requested-item">
          <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Allergies</span>
        </div>
        <div class="requested-item">
          <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Medications</span>
        </div>
      </div>

      <div class="action-row">
        <button class="btn-reject">Reject</button>
        <button class="btn-approve">Approve<br>Access</button>
      </div>

    </div>

    <div class="home-indicator"></div>
  </div>

  <script src="medtrace-navigation.js"></script>
</body>
</html>

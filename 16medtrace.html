<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTrace - Provider Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* iPhone Frame */
    .phone-mockup {
      width: 375px;
      height: 760px;
      background-color: #ffffff;
      border: 4px solid #4a4d52;
      border-radius: 48px;
      position: relative;
      box-shadow: inset 0 0 0 2px #1f2124, 0 0 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Notch */
    .notch {
      width: 130px;
      height: 26px;
      background-color: #000000;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 10;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 12px 28px 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
      z-index: 5;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-signal { width: 14px; height: 10px; fill: #000000; }
    .icon-wifi { width: 13px; height: 10px; fill: #000000; }
    .icon-battery {
      width: 20px;
      height: 10px;
      border: 1px solid #000000;
      border-radius: 3px;
      padding: 1px;
      position: relative;
    }
    .icon-battery::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #000000;
      border-radius: 0 1px 1px 0;
    }
    .battery-level {
      width: 100%;
      height: 100%;
      background-color: #000000;
      border-radius: 1px;
    }

    /* Content Area */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 20px 0 20px;
      overflow-y: auto;
    }

    .app-content::-webkit-scrollbar {
      display: none;
    }

    /* Dashboard Header Title */
    .page-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0c2340;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    /* Main Action Card */
    .scan-card {
      background-color: #0d2847;
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(13, 40, 71, 0.25);
      margin-bottom: 30px;
      cursor: pointer;
    }

    .scan-card-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .scan-card-subtitle {
      font-size: 0.68rem;
      color: #cbd5e1;
      line-height: 1.3;
      font-weight: 400;
    }

    /* Recent Patients Section */
    .section-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #0c2340;
      margin-bottom: 12px;
    }

    .patient-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .patient-card {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #ffffff;
    }

    .user-icon-box {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-icon-box svg {
      width: 18px;
      height: 18px;
      stroke: #94a3b8;
      fill: none;
      stroke-width: 2;
    }

    .patient-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .patient-name {
      font-size: 0.68rem;
      color: #94a3b8;
      font-weight: 500;
    }

    .last-scan {
      font-size: 0.6rem;
      color: #cbd5e1;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      height: 56px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      background-color: #ffffff;
      padding-bottom: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke: #0c2340;
      fill: none;
      stroke-width: 2;
    }

    .nav-item.active svg {
      stroke: #0c2340;
      fill: #0c2340;
    }

    /* Home Indicator Notch */
    .home-indicator {
      width: 125px;
      height: 4px;
      background-color: #000000;
      border-radius: 2px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    <div class="notch"></div>

      <div class="status-icons">

          </div>
          <div class="patient-info">
            <span class="patient-name">Name</span>
            <span class="last-scan">Last scan</span>
          </div>
        </div>

        <div class="patient-card">
          <div class="user-icon-box">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="patient-info">
            <span class="patient-name">Name</span>
            <span class="last-scan">Last scan</span>

        </div>
      </div>

    </div>

    <script src="medtrace-navigation.js"></script>

        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>

        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

</body>

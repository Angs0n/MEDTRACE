<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTrace - Drawer Menu View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Phone Outer Frame */
    .phone-mockup {
      width: 375px;
      height: 760px;
      background-color: #f8fafc;
      border: 4px solid #4a4d52;
      border-radius: 48px;
      position: relative;
      box-shadow: inset 0 0 0 2px #1f2124, 0 0 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    /* Top Camera Notch */
    .notch {
      width: 130px;
      height: 26px;
      background-color: #000000;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 30;
    }

    /* Layout Wrapper */
    .screen-layout {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #f8fafc;
      overflow: hidden;
    }

    /* Left Drawer / Sidebar */
    .sidebar-drawer {
      width: 70%;
      height: 100%;
      background-color: #ffffff;
      padding: 64px 0 0 0;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .brand-section {
      padding: 0 24px;
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0b1f3a;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
    }

    .brand-divider {
      width: 100%;
      height: 1px;
      background-color: #cbd5e1;
      margin-bottom: 28px;
    }

    /* Navigation Items List */
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 24px;
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
      position: relative;
      cursor: pointer;
    }

    .nav-item.active {
      color: #0b1f3a;
      font-weight: 700;
    }

    /* Active State Pill Marker */
    .active-indicator-pill {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 5px;
      height: 28px;
      background-color: #2563eb;
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
    }

    .nav-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      flex-shrink: 0;
    }

    /* Background Content Peeking Right */
    .main-content-peek {
      position: absolute;
      top: 0;
      left: 68%;
      width: 100%;
      height: 100%;
      background-color: #f8fafc;
      padding: 64px 16px 20px 16px;
      z-index: 5;
    }

    .peek-header {
      margin-bottom: 20px;
    }

    .peek-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0b1f3a;
    }

    .peek-subtitle {
      font-size: 0.65rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* Background Medical Profile Cards */
    .peek-card {
      width: 100%;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .card-icon-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .card-icon-column svg {
      width: 15px;
      height: 15px;
      stroke: #0b1f3a;
      fill: none;
      stroke-width: 1.8;
    }

    .card-icon-column .fill-icon {
      fill: #0b1f3a;
      stroke: none;
    }

    /* Bottom Home Indicator Bar */
    .home-indicator {
      width: 125px;
      height: 4px;
      background-color: #000000;
      border-radius: 2px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    <!-- Top Camera Notch -->
    <div class="notch"></div>

    <div class="screen-layout">
      <!-- Drawer Sidebar Menu -->
      <aside class="sidebar-drawer">
        <div class="brand-section">
          <h1 class="brand-title">MedTrace</h1>
          <div class="brand-divider"></div>
        </div>

        <ul class="nav-list">
          <li>
            <a class="nav-item active">
              <div class="active-indicator-pill"></div>
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a class="nav-item">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
              <span>Medical Profile</span>
            </a>
          </li>
          <li>
            <a class="nav-item">
              <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span>My QR Code</span>
            </a>
          </li>
          <li>
            <a class="nav-item">
              <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              <span>Emergency Profile</span>
            </a>
          </li>
          <li>
            <a class="nav-item">
              <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>Access History</span>
            </a>
          </li>
        </ul>
      </aside>

      <!-- Main Content Screen Peeking from Behind -->
      <main class="main-content-peek">
        <!-- Background Header -->
        <div class="peek-header">
          <div class="peek-title">Medi</div>
          <div class="peek-subtitle">Manage</div>
        </div>

        <!-- Upper Card (Document, User, Calendar, Blood Drop, Pencil) -->
        <div class="peek-card" style="height: 200px;">
          <div class="card-icon-column">
            <!-- File Document -->
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <!-- User -->
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <!-- Calendar -->
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <!-- Blood Drop -->
            <svg class="fill-icon" viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            <!-- Pencil -->
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
        </div>

        <!-- Middle Card (Stethoscope, Dot, Pencil) -->
        <div class="peek-card" style="height: 140px;">
          <div class="card-icon-column">
            <!-- Stethoscope -->
            <svg viewBox="0 0 24 24"><path d="M4.8 2.3A.3.3 0 0 0 4.5 2h-1a.3.3 0 0 0-.3.3V9a5 5 0 0 0 10 0V2.3a.3.3 0 0 0-.3-.3h-1a.3.3 0 0 0-.3.3V9a3 3 0 0 1-6 0V2.3z"/><path d="M8 14v2a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg>
            <!-- Dot -->
            <svg class="fill-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></svg>
            <!-- Pencil -->
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
        </div>

        <!-- Bottom Card (First Aid Bag) -->
        <div class="peek-card" style="height: 70px;">
          <div class="card-icon-column">
            <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v3"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
          </div>
        </div>
      </main>
    </div>

    <!-- Home Bar Indicator Notch -->
    <div class="home-indicator"></div>
  </div>

  <script src="medtrace-navigation.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedTrace - Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* iPhone Frame */
    .phone-mockup {
      width: 375px;
      height: 760px;
      background-color: #ffffff;
      border: 4px solid #4a4d52;
      border-radius: 48px;
      position: relative;
      box-shadow: inset 0 0 0 2px #1f2124, 0 0 30px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Notch */
    .notch {
      width: 130px;
      height: 26px;
      background-color: #000000;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 10;
    }

    /* Status Bar */
    .status-bar {
      height: 44px;
      padding: 12px 28px 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
      z-index: 5;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-signal { width: 14px; height: 10px; fill: #000000; }
    .icon-wifi { width: 13px; height: 10px; fill: #000000; }
    .icon-battery {
      width: 20px;
      height: 10px;
      border: 1px solid #000000;
      border-radius: 3px;
      padding: 1px;
      position: relative;
    }
    .icon-battery::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #000000;
      border-radius: 0 1px 1px 0;
    }
    .battery-level {
      width: 100%;
      height: 100%;
      background-color: #000000;
      border-radius: 1px;
    }

    /* Content Area */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px 18px 0 18px;
      overflow-y: auto;
    }

    .app-content::-webkit-scrollbar {
      display: none;
    }

    /* Header Greeting */
    .header {
      margin-bottom: 16px;
    }

    .greeting {
      font-size: 1.1rem;
      font-weight: 800;
      color: #000000;
    }

    .sub-greeting {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 2px;
    }

    /* Main QR Card Banner */
    .qr-banner-card {
      background-color: #0d2847;
      border-radius: 20px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .banner-title {
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* Mini QR Code Frame */
    .mini-qr-frame {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .btn-show-qr {
      background-color: #1976d2;
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 8px 24px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Section Headings */
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 10px;
    }

    /* Horizontal Scroll / Grid Lists */
    .horizontal-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 18px;
    }

    .horizontal-scroll::-webkit-scrollbar {
      display: none;
    }

    /* Medical Profile Item Card */
    .profile-card {
      background-color: #0d2847;
      border-radius: 12px;
      min-width: 82px;
      height: 72px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .profile-card svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
    }

    .profile-card span {
      color: #ffffff;
      font-size: 0.6rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.1;
    }

    /* Quick Access Row Cards */
    .quick-access-grid {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .quick-card {
      background-color: #0d2847;
      border-radius: 12px;
      flex: 1;
      height: 48px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quick-card svg {
      width: 18px;
      height: 18px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      flex-shrink: 0;
    }

    .quick-card span {
      color: #ffffff;
      font-size: 0.62rem;
      font-weight: 600;
      line-height: 1.2;
    }

    /* Bottom Navigation Bar */
    .navbar {
      height: 56px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: #ffffff;
      padding-bottom: 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      cursor: pointer;
    }

    .nav-item.active {
      color: #1976d2;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* Home Indicator Notch */
    .home-indicator {
      width: 125px;
      height: 4px;
      background-color: #000000;
      border-radius: 2px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <div class="phone-mockup">
    <!-- Top Notch -->
    <div class="notch"></div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <svg class="icon-signal" viewBox="0 0 16 12">
          <rect x="0" y="9" width="3" height="3" rx="0.5"/>
          <rect x="4" y="6" width="3" height="6" rx="0.5"/>
          <rect x="8" y="3" width="3" height="9" rx="0.5"/>
          <rect x="12" y="0" width="3" height="12" rx="0.5"/>

        <svg class="icon-wifi" viewBox="0 0 16 12">

        </svg>
        <div class="icon-battery">
          <div class="battery-level"></div>
        </div>
      </div>
    </div>

    <!-- Screen Content Area -->
    <div class="app-content">
      
      <!-- Greeting Header -->
      <div class="header">
        <h1 class="greeting">Good morning, Jenny</h1>
        <p class="sub-greeting">Your MedTrace</p>
      </div>

      <!-- Main QR Card -->
      <div class="qr-banner-card">
        <h2 class="banner-title">Your MedTrace QR</h2>
        
        <div class="mini-qr-frame">

            <rect x="85" y="0" width="35" height="35" rx="4" fill="#000000"/>
            <rect x="91" y="6" width="23" height="23" rx="2" fill="#ffffff"/>
            <rect x="97" y="12" width="11" height="11" fill="#000000"/>

            <rect x="0" y="85" width="35" height="35" rx="4" fill="#000000"/>
            <rect x="6" y="91" width="23" height="23" rx="2" fill="#ffffff"/>
            <rect x="12" y="97" width="11" height="11" fill="#000000"/>

            <!-- High density blocks -->
            <rect x="42" y="0" width="8" height="8" fill="#000"/>
            <rect x="54" y="0" width="12" height="8" fill="#000"/>
            <rect x="72" y="0" width="8" height="8" fill="#000"/>

            <rect x="42" y="12" width="12" height="8" fill="#000"/>
            <rect x="60" y="12" width="8" height="14" fill="#000"/>
            <rect x="72" y="12" width="8" height="8" fill="#000"/>

            <rect x="48" y="24" width="8" height="12" fill="#000"/>
            <rect x="72" y="24" width="8" height="8" fill="#000"/>

            <rect x="0" y="42" width="12" height="8" fill="#000"/>
            <rect x="18" y="42" width="8" height="14" fill="#000"/>
            <rect x="32" y="42" width="8" height="8" fill="#000"/>
            <rect x="85" y="42" width="12" height="8" fill="#000"/>
            <rect x="102" y="42" width="18" height="8" fill="#000"/>

            <rect x="8" y="54" width="8" height="18" fill="#000"/>
            <rect x="22" y="58" width="8" height="8" fill="#000"/>
            <rect x="91" y="54" width="8" height="12" fill="#000"/>
            <rect x="105" y="54" width="15" height="8" fill="#000"/>

            <rect x="0" y="68" width="18" height="8" fill="#000"/>
            <rect x="28" y="68" width="8" height="12" fill="#000"/>
            <rect x="85" y="68" width="8" height="12" fill="#000"/>
            <rect x="100" y="68" width="8" height="8" fill="#000"/>

            <rect x="42" y="85" width="12" height="8" fill="#000"/>
            <rect x="60" y="85" width="8" height="14" fill="#000"/>
            <rect x="72" y="85" width="8" height="8" fill="#000"/>

            <rect x="48" y="97" width="8" height="12" fill="#000"/>
            <rect x="60" y="102" width="12" height="8" fill="#000"/>
            <rect x="78" y="97" width="8" height="18" fill="#000"/>

            <rect x="42" y="112" width="15" height="8" fill="#000"/>
            <rect x="62" y="112" width="8" height="8" fill="#000"/>
            <rect x="95" y="112" width="18" height="8" fill="#000"/>

            <!-- Center Badge -->
            <rect x="37" y="37" width="46" height="46" rx="4" fill="#ffffff"/>
            <rect x="40" y="40" width="40" height="40" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
            <text x="60" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#000000" text-anchor="middle">SCAN</text>
            <text x="60" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="800" fill="#000000" text-anchor="middle">ME</text>
          </svg>
        </div>

        <button class="btn-show-qr">Show QR</button>
      </div>

      <!-- Medical Profile Section -->
      <h3 class="section-title">Medical Profile</h3>
      <div class="horizontal-scroll">
        <div class="profile-card">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20" stroke-linecap="round"/></svg>

        </div>

          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12h6"/></svg>

      <!-- Quick Access Section -->
      <h3 class="section-title">Quick Access</h3>
      <div class="quick-access-grid">

          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span>Emergency Profile</span>

        <div class="quick-card">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Access History</span>
        </div>
      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="navbar">
      <div class="nav-item active">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>

      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>

    <!-- Home Indicator Notch -->
    <div class="home-indicator"></div>
  </div>

  <script src="medtrace-navigation.js"></script>
</body>
</html>
